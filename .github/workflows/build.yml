# Builds the plugin on GitHub's servers every time code is pushed or a pull request is opened/updated.
# Results show up in the "Actions" tab and as a check (✅ / ❌) on pull requests.
# The built MobHeads.jar can be downloaded from each run's "Artifacts" section.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven # reuse downloaded dependencies between runs

      - name: Build with Maven
        run: mvn -B clean package

      - name: Upload the plugin jar
        uses: actions/upload-artifact@v7
        with:
          name: MobHeads-build-${{ github.run_number }}
          path: target/MobHeads.jar
          if-no-files-found: error
