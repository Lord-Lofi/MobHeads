name: MobHeads
main: com.cyber.mobheads.Main
version: ${project.version}
authors:
    - CyberDrain
    - Zombie_Striker
    - Lord_Lofi
api-version: '26.3'
description: Allows players to behead mobs and other players!
commands:
    mobheads:
        description: Main command with several sub commands
        aliases: [mh, mobhead]
softdepend:
    - WorldGuard
permissions:
    com.cyber.mobheads.collection:
        description: Open your own mob head collection book with /mobheads collection
        default: true
    com.cyber.mobheads.collection.others:
        description: View another online player's collection with /mobheads collection <player>
        default: op
    com.cyber.mobheads.headlore:
        description: Turn head lore on or off for your own heads with /mobheads headlore
        default: true